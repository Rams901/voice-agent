<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Frontdesk — agent test call</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e7eaf0; --muted: #9aa4b6; --accent: #4f8cff; --ok: #37d39b; --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px; background: var(--bg); color: var(--text);
    font: 15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  .status { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); animation: pulse 1.4s infinite; }
  .dot.err { background: var(--bad); }
  @keyframes pulse { 50% { opacity: .3; } }
  textarea {
    width: 100%; background: #0c0e13; color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: vertical; min-height: 72px;
  }
  .transcript { margin-top: 20px; max-height: 52vh; overflow-y: auto; }
  .turn { padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--line); }
  .turn.agent { background: #141a26; }
  .turn.user { background: #1a1620; }
  .who { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; }
  code { background: #0c0e13; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Frontdesk — agent test call</h1>
  <p class="sub">
    Live browser call against the deployed conversation flow. Grant microphone
    access when prompted; audio is handled by Retell, so check the mic is not muted.
  </p>

  <div class="panel">
    <div class="row">
      <button id="start">Start call</button>
      <button id="stop" class="ghost" disabled>End call</button>
      <span class="status"><span id="dot" class="dot"></span><span id="label">idle</span></span>
    </div>

    <div id="tokenBox" style="margin-top:16px; display:none;">
      <p class="hint">No token found in the URL. Paste an access token from <code>python -m frontdesk.cli webcall</code>:</p>
      <textarea id="token" placeholder="access_token…"></textarea>
    </div>
    <p id="error" class="err" style="display:none;"></p>
  </div>

  <div class="panel transcript" id="transcript" style="display:none;"></div>
</div>

<script type="module">
import { RetellWebClient } from "https://esm.sh/retell-client-js-sdk@3.0.1";

const el = (id) => document.getElementById(id);
const client = new RetellWebClient();

// Token arrives in the URL hash so the page works straight off the filesystem.
const params = new URLSearchParams(location.hash.slice(1));
const urlToken = params.get("token");
if (!urlToken) el("tokenBox").style.display = "block";

function setStatus(text, kind) {
  el("label").textContent = text;
  el("dot").className = "dot" + (kind ? " " + kind : "");
  el("start").disabled = kind === "live";
  el("stop").disabled = kind !== "live";
}

function showError(message) {
  el("error").style.display = "block";
  el("error").textContent = message;
}

function addTurn(role, content) {
  const box = el("transcript");
  box.style.display = "block";
  const last = box.lastElementChild;
  // Retell streams partial content, so update the in-flight turn in place.
  if (last && last.dataset.role === role && last.dataset.streaming === "1") {
    last.querySelector(".text").textContent = content;
    return;
  }
  for (const t of box.children) t.dataset.streaming = "0";
  const turn = document.createElement("div");
  turn.className = "turn " + role;
  turn.dataset.role = role;
  turn.dataset.streaming = "1";
  turn.innerHTML = `<div class="who">${role === "agent" ? "Agent" : "Caller"}</div>
                    <div class="text"></div>`;
  turn.querySelector(".text").textContent = content;
  box.appendChild(turn);
  box.scrollTop = box.scrollHeight;
}

client.on("call_started", () => { setStatus("live", "live"); el("error").style.display = "none"; });
client.on("call_ready",  () => setStatus("live", "live"));
client.on("call_ended",  () => setStatus("ended"));
client.on("error", (e) => { setStatus("error", "err"); showError(String(e?.message || e)); });

// Retell emits incremental transcript updates; render the latest of each role.
client.on("update", (update) => {
  if (!update || !Array.isArray(update.transcript)) return;
  el("transcript").innerHTML = "";
  for (const item of update.transcript) {
    const role = item.role === "agent" ? "agent" : "user";
    const turn = document.createElement("div");
    turn.className = "turn " + role;
    turn.innerHTML = `<div class="who">${role === "agent" ? "Agent" : "Caller"}</div>
                      <div class="text"></div>`;
    turn.querySelector(".text").textContent = item.content || "";
    el("transcript").appendChild(turn);
  }
  el("transcript").style.display = "block";
  el("transcript").scrollTop = el("transcript").scrollHeight;
});

el("start").addEventListener("click", async () => {
  const token = urlToken || el("token").value.trim();
  if (!token) { showError("Paste an access token first."); return; }
  try {
    setStatus("connecting…");
    await client.startCall({ accessToken: token });
    setStatus("live", "live");
  } catch (e) {
    setStatus("error", "err");
    showError(String(e?.message || e));
  }
});

el("stop").addEventListener("click", () => {
  client.stopCall();
  setStatus("ended");
});
</script>
</body>
</html>
